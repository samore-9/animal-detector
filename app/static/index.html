<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>Animal Scanner</title>
<style>
:root{--void:#05070d;--ink:#eaf6ff;--muted:#8da2b8;--cyan:#5ef2ff;--violet:#8b7bff;--danger:#ff7a8a;--r:28px;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{min-height:100vh;color:var(--ink);background:radial-gradient(1200px 700px at 15% -10%,#14204a 0%,transparent 60%),radial-gradient(900px 600px at 95% 10%,#2a1457 0%,transparent 55%),var(--void);
font-family:"SF Pro Display","Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.5;overflow-x:hidden;
padding:max(20px,env(safe-area-inset-top)) 18px max(40px,env(safe-area-inset-bottom))}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.floor{position:fixed;left:-20%;right:-20%;bottom:-6vh;height:46vh;z-index:0;pointer-events:none;
background:repeating-linear-gradient(90deg,rgba(94,242,255,.28) 0 1px,transparent 1px 64px),repeating-linear-gradient(0deg,rgba(139,123,255,.28) 0 1px,transparent 1px 64px);
transform:perspective(520px) rotateX(64deg);transform-origin:bottom;animation:flow 6s linear infinite;
-webkit-mask-image:linear-gradient(to top,#000 5%,transparent 85%);mask-image:linear-gradient(to top,#000 5%,transparent 85%);opacity:.55}
@keyframes flow{to{background-position:0 64px,64px 0}}
main{position:relative;z-index:1;max-width:1040px;margin:0 auto;perspective:1400px}
.top{display:flex;align-items:center;gap:10px;margin:6px 0 0}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-size:.85rem;color:var(--muted);
background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px)}
.dot{width:8px;height:8px;border-radius:50%;background:#556;box-shadow:0 0 0 0 transparent}
.dot.on{background:#4dffb0;box-shadow:0 0 12px #4dffb0}
h1{font-size:clamp(2.1rem,6.2vw,4rem);font-weight:700;letter-spacing:-.035em;line-height:1.04;margin:26px 0 12px;max-width:16ch;
background:linear-gradient(180deg,#fff 20%,#9fdcff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{color:var(--muted);margin:0 0 30px;max-width:52ch;font-size:1.05rem}
.scene{animation:enter 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateZ(-260px) translateY(30px) rotateX(10deg)}to{opacity:1;transform:none}}

.glass{position:relative;border-radius:var(--r);background:linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.03));
border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);
box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 40px 90px rgba(0,0,0,.55),0 0 80px rgba(94,242,255,.07)}
.tilt{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;transition:transform .18s ease-out}
.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
background:radial-gradient(420px circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.13),transparent 60%)}

/* drop zone */
.drop{display:grid;place-items:center;text-align:center;min-height:400px;padding:30px 24px;cursor:pointer;overflow:hidden}
.drop:focus-visible{outline:2px solid var(--cyan);outline-offset:6px}
.hologram{position:relative;width:230px;height:200px;margin:0 auto 8px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.holo{position:absolute;left:50%;bottom:0;width:210px;height:210px;margin-left:-105px;transform:rotateX(68deg);transform-style:preserve-3d}
.ring{position:absolute;border-radius:50%;border:2px solid var(--cyan);box-shadow:0 0 18px rgba(94,242,255,.6),inset 0 0 18px rgba(94,242,255,.35);animation:spin 9s linear infinite}
.r1{inset:0}
.r2{inset:22px;border-style:dashed;border-color:var(--violet);box-shadow:0 0 16px rgba(139,123,255,.7);animation-duration:14s;animation-direction:reverse;transform:translateZ(22px)}
.r3{inset:48px;border-width:3px;border-color:#fff;border-left-color:transparent;border-bottom-color:transparent;animation-duration:3.5s;transform:translateZ(44px)}
@keyframes spin{to{rotate:360deg}}
.core{position:absolute;left:50%;top:18px;width:58px;height:58px;margin-left:-29px;border-radius:50%;
background:radial-gradient(circle at 35% 30%,#fff,var(--cyan) 35%,#2a5cff 75%,transparent 76%);box-shadow:0 0 50px rgba(94,242,255,.9),0 0 120px rgba(139,123,255,.6);animation:float 3.6s ease-in-out infinite}
.cone{position:absolute;left:50%;top:70px;width:90px;height:90px;margin-left:-45px;background:linear-gradient(180deg,rgba(94,242,255,.5),transparent);clip-path:polygon(35% 0,65% 0,100% 100%,0 100%);filter:blur(5px);opacity:.7}
@keyframes float{50%{transform:translateY(-10px)}}
.drop.over .hologram{transform:scale(1.18) translateY(-6px)}
.drop.over .ring{animation-duration:2s}.drop.over .r2{animation-duration:3s}
.drop.over{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 1px var(--cyan),0 0 90px rgba(94,242,255,.35),0 40px 90px rgba(0,0,0,.55)}
.drop strong{display:block;font-size:1.5rem;letter-spacing:-.02em;margin:6px 0 6px}
.drop .hint{display:block;color:var(--muted);font-size:.95rem;max-width:42ch;margin:0 auto}
.browse{display:inline-block;margin-top:20px;padding:12px 26px;border-radius:999px;font-weight:600;color:#02121a;
background:linear-gradient(135deg,var(--cyan),#9a8cff);box-shadow:0 0 30px rgba(94,242,255,.45),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .2s,box-shadow .2s}
.drop:hover .browse{transform:translateY(-2px);box-shadow:0 0 44px rgba(94,242,255,.7),inset 0 1px 0 rgba(255,255,255,.6)}
input[type=file]{display:none}[hidden]{display:none!important}
.error{margin-top:18px;padding:14px 18px;border-radius:16px;color:var(--danger);border:1px solid rgba(255,122,138,.5);background:rgba(255,122,138,.09);backdrop-filter:blur(12px)}

/* results */
.stage{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:26px;align-items:start}
@media(max-width:820px){.stage{grid-template-columns:1fr}}
.photo{overflow:hidden;padding:10px}
.frame{position:relative;border-radius:20px;overflow:hidden;line-height:0;background:#000}
.frame img{display:block;width:100%;height:auto}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,7,13,.55);backdrop-filter:blur(2px);font-weight:600;line-height:1.4;overflow:hidden}
.sweep{position:absolute;left:0;right:0;height:90px;top:-90px;background:linear-gradient(180deg,transparent,rgba(94,242,255,.35));border-bottom:2px solid var(--cyan);box-shadow:0 10px 40px rgba(94,242,255,.7);animation:sweep 1.8s ease-in-out infinite}
@keyframes sweep{to{top:100%}}
.busy .lbl{position:relative;padding:10px 20px;border-radius:999px;background:rgba(5,7,13,.7);border:1px solid rgba(94,242,255,.5);box-shadow:0 0 24px rgba(94,242,255,.35)}
.panel{padding:26px;transform:translateZ(40px)}
.panel h2{font-size:1.45rem;letter-spacing:-.02em;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px;padding:0;list-style:none}
.chip{display:inline-flex;gap:8px;align-items:center;padding:9px 16px;border-radius:999px;font-weight:600;color:var(--c);
background:rgba(255,255,255,.05);border:1px solid var(--c);box-shadow:0 0 20px -4px var(--c),inset 0 0 14px -8px var(--c);animation:pop .6s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i,0)*90ms)}
.chip small{color:var(--muted);font-weight:500}
@keyframes pop{from{opacity:0;transform:translateZ(-80px) scale(.7)}to{opacity:1;transform:none}}
.note{color:var(--muted);font-size:.92rem;margin:0 0 16px}
.rows{list-style:none;margin:0 0 20px;padding:0}
.rows li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-top:1px solid rgba(255,255,255,.1);font-size:.95rem;animation:pop .5s ease both;animation-delay:calc(var(--i,0)*70ms + 200ms)}
.bar{grid-column:1/-1;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);box-shadow:0 0 12px var(--c);transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms + 300ms)}
@keyframes grow{from{transform:scaleX(0)}}
.control{margin:18px 0}
.control label{display:flex;justify-content:space-between;font-size:.92rem;color:var(--muted);margin-bottom:8px}
.control output{color:var(--cyan);font-weight:600}
input[type=range]{width:100%;accent-color:var(--cyan)}
button.again{font:inherit;font-weight:600;cursor:pointer;padding:12px 22px;border-radius:999px;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);transition:all .2s}
button.again:hover{border-color:var(--cyan);box-shadow:0 0 26px rgba(94,242,255,.35)}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
footer{margin-top:34px;color:var(--muted);font-size:.85rem}
@media(max-width:560px){.drop{min-height:340px}.hologram{transform:scale(.85)}.tilt{transform:none!important}.panel{padding:20px;transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.floor{animation:none}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="floor" aria-hidden="true"></div>
<main class="scene">
  <div class="top"><span class="pill"><i id="status" class="dot"></i><span id="statusTxt">Connecting to scanner</span></span></div>
  <h1>What animals are in your photo?</h1>
  <p class="lede">Drop in a picture. The scanner finds every animal, outlines it and tells you what it is.</p>

  <section id="start">
    <div id="drop" class="drop glass tilt" data-tilt tabindex="0" role="button" aria-label="Choose an image or drop it here">
      <div>
        <div class="hologram" aria-hidden="true">
          <div class="holo"><i class="ring r1"></i><i class="ring r2"></i><i class="ring r3"></i></div>
          <i class="cone"></i><i class="core"></i>
        </div>
        <strong>Drop an image to scan</strong>
        <span class="hint">JPG, PNG, WEBP, BMP, GIF or TIFF, up to 15 MB. You can also paste with Ctrl+V.</span>
        <span class="browse">Browse files</span>
      </div>
    </div>
    <input id="file" type="file" accept="image/*">
  </section>

  <div id="error" class="error" role="alert" hidden></div>

  <section id="stage" class="stage" hidden>
    <div class="photo glass tilt" data-tilt>
      <div class="frame">
        <img id="img" alt="Your uploaded photo">
        <canvas id="canvas"></canvas>
        <div id="busy" class="busy" hidden><i class="sweep"></i><span class="lbl">Scanning for animals...</span></div>
      </div>
    </div>
    <div class="panel glass" aria-live="polite">
      <h2 id="headline">Analyzing...</h2>
      <ul id="chips" class="chips"></ul>
      <p id="note" class="note" hidden></p>
      <ul id="rows" class="rows"></ul>
      <div class="control">
        <label for="conf"><span>Minimum confidence</span><output id="confOut">35%</output></label>
        <input id="conf" type="range" min="10" max="90" value="35">
      </div>
      <button id="again" class="again" type="button">Scan another image</button>
    </div>
  </section>
  <footer id="footer"></footer>
</main>

<script>
const $=(s)=>document.querySelector(s);
const drop=$('#drop'),input=$('#file'),errBox=$('#error'),stage=$('#stage'),start=$('#start'),img=$('#img'),canvas=$('#canvas');
const slider=$('#conf'),confOut=$('#confOut');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let currentFile=null,lastResult=null,reqId=0,timer=null,objectUrl=null,boost=1;

const pretty=(s)=>s.replace(/\b\w/g,(c)=>c.toUpperCase());
const colorFor=(l,a)=>{let h=0;for(const ch of l)h=(h*31+ch.charCodeAt(0))%360;return a==null?`hsl(${h} 100% 66%)`:`hsl(${h} 100% 66% / ${a})`};
const pct=(x)=>Math.round(x*100)+'%';
const showError=(m)=>{errBox.textContent=m;errBox.hidden=false};
const hideError=()=>{errBox.hidden=true};

/* ---------- ambient particles ---------- */
const fx=$('#fx'),fc=fx.getContext('2d');let P=[],W=0,H=0,px=0,py=0,tx=0,ty=0;
function sizeFx(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;fx.width=W*d;fx.height=H*d;fc.setTransform(d,0,0,d,0,0);
  const n=Math.min(110,Math.floor(W*H/14000));P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*.9+.1,v:Math.random()*.25+.05,c:Math.random()<.65?'94,242,255':'139,123,255'}))}
function frame(){fc.clearRect(0,0,W,H);px+=(tx-px)*.05;py+=(ty-py)*.05;
  for(const p of P){p.y-=p.v*p.z*boost;if(p.y<-10){p.y=H+10;p.x=Math.random()*W}
    const x=p.x+px*40*p.z,y=p.y+py*40*p.z,r=p.z*2.2;
    fc.beginPath();fc.arc(x,y,r,0,6.283);fc.fillStyle=`rgba(${p.c},${.25+p.z*.55})`;fc.shadowColor=`rgb(${p.c})`;fc.shadowBlur=10*p.z;fc.fill()}
  if(!reduce)requestAnimationFrame(frame)}
addEventListener('resize',sizeFx);
addEventListener('pointermove',(e)=>{tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5});
sizeFx();frame();

/* ---------- 3D tilt + glare ---------- */
document.querySelectorAll('[data-tilt]').forEach((el)=>{
  el.addEventListener('pointermove',(e)=>{if(reduce||e.pointerType==='touch')return;const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    el.style.setProperty('--ry',((x-.5)*9)+'deg');el.style.setProperty('--rx',((.5-y)*9)+'deg');el.style.setProperty('--gx',x*100+'%');el.style.setProperty('--gy',y*100+'%')});
  el.addEventListener('pointerleave',()=>{el.style.setProperty('--rx','0deg');el.style.setProperty('--ry','0deg')})});

/* ---------- choosing a file ---------- */
drop.addEventListener('click',()=>input.click());
drop.addEventListener('keydown',(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();input.click()}});
input.addEventListener('change',()=>{if(input.files[0])handleFile(input.files[0]);input.value=''});
['dragenter','dragover'].forEach((t)=>drop.addEventListener(t,(e)=>{e.preventDefault();drop.classList.add('over');boost=4}));
['dragleave','drop'].forEach((t)=>drop.addEventListener(t,(e)=>{e.preventDefault();drop.classList.remove('over');boost=1}));
drop.addEventListener('drop',(e)=>{const f=e.dataTransfer.files[0];if(f)handleFile(f)});
['dragover','drop'].forEach((t)=>addEventListener(t,(e)=>e.preventDefault()));
addEventListener('drop',(e)=>{if(!drop.contains(e.target)&&e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0])});
addEventListener('paste',(e)=>{const it=[...(e.clipboardData?.items||[])].find((i)=>i.type.startsWith('image/'));if(it)handleFile(it.getAsFile())});

function handleFile(file){
  hideError();
  if(!file.type.startsWith('image/')){showError('That file is not an image. Choose a JPG, PNG, WEBP, BMP, GIF or TIFF file.');return}
  if(file.size>15*1024*1024){showError('That image is larger than 15 MB. Choose a smaller one.');return}
  currentFile=file;lastResult=null;
  if(objectUrl)URL.revokeObjectURL(objectUrl);
  objectUrl=URL.createObjectURL(file);clearCanvas();
  img.onload=()=>analyze();
  img.onerror=()=>{showError('Your browser cannot display this image format. Convert it to JPG or PNG and try again.');reset()};
  img.src=objectUrl;start.hidden=true;stage.hidden=false;
  $('#headline').textContent='Analyzing...';$('#chips').innerHTML='';$('#rows').innerHTML='';$('#note').hidden=true;
}
function reset(){stage.hidden=true;start.hidden=false;currentFile=null;reqId++;boost=1}
$('#again').addEventListener('click',()=>{hideError();reset()});

/* ---------- talking to the server ---------- */
slider.addEventListener('input',()=>{confOut.textContent=slider.value+'%';clearTimeout(timer);timer=setTimeout(()=>{if(currentFile)analyze()},350)});

async function analyze(){
  const id=++reqId;hideError();$('#busy').hidden=false;boost=3;
  const fd=new FormData();fd.append('file',currentFile);fd.append('conf',slider.value/100);
  try{
    const res=await fetch('/api/detect',{method:'POST',body:fd});
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.detail||`The server returned an error (${res.status}).`);
    if(id!==reqId)return;
    lastResult=data;render(data);
  }catch(e){
    if(id!==reqId)return;
    showError(e.message==='Failed to fetch'?'Could not reach the server. Check that python run.py is still running.':e.message);
    $('#headline').textContent='Something went wrong';
  }finally{if(id===reqId){$('#busy').hidden=true;boost=1}}
}

/* ---------- showing results ---------- */
function render(data){
  const chips=$('#chips'),rows=$('#rows'),note=$('#note');
  chips.innerHTML='';rows.innerHTML='';note.hidden=true;
  if(!data.animals.length){
    $('#headline').textContent='No animals found';
    note.textContent='Try lowering the minimum confidence, or use a photo where the animal is larger and clearer.';note.hidden=false;
  }else{
    const n=data.detections.length;
    $('#headline').textContent=data.mode==='classifier'?'Best guess for this photo':`Found ${n} ${n===1?'animal':'animals'}`;
    data.animals.forEach((a,i)=>{
      const li=document.createElement('li');li.className='chip';li.style.setProperty('--c',colorFor(a.label));li.style.setProperty('--i',i);
      li.innerHTML=`${pretty(a.label)}${a.count>1?` <small>x${a.count}</small>`:''}`;chips.appendChild(li)});
    if(data.mode==='classifier'){note.textContent="No individual animals were outlined, so this is the classifier's guess for the whole image.";note.hidden=false}
    data.detections.forEach((d,i)=>{
      const li=document.createElement('li');li.style.setProperty('--c',colorFor(d.label));li.style.setProperty('--i',i);
      li.innerHTML=`<span>${pretty(d.label)}</span><span>${pct(d.confidence)}</span><div class="bar"><i style="width:${pct(d.confidence)}"></i></div>`;rows.appendChild(li)});
  }
  drawBoxes(data);
  $('#footer').textContent=`Model: ${data.model}. Took ${data.ms} ms.`;
}

function clearCanvas(){canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height)}

function drawBoxes(data){
  const Wd=img.naturalWidth,Ht=img.naturalHeight;canvas.width=Wd;canvas.height=Ht;
  const ctx=canvas.getContext('2d');ctx.clearRect(0,0,Wd,Ht);
  const lw=Math.max(3,Wd/260),fs=Math.max(14,Wd/44);
  ctx.font=`600 ${fs}px "Segoe UI",system-ui,sans-serif`;ctx.textBaseline='middle';ctx.lineCap='round';
  for(const d of data.detections){
    if(!d.box)continue;
    const x1=d.box[0]*Wd,y1=d.box[1]*Ht,w=(d.box[2]-d.box[0])*Wd,h=(d.box[3]-d.box[1])*Ht,c=colorFor(d.label),L=Math.min(w,h)*.22;
    ctx.fillStyle=colorFor(d.label,.09);ctx.fillRect(x1,y1,w,h);
    ctx.shadowColor=c;ctx.shadowBlur=lw*5;ctx.strokeStyle=colorFor(d.label,.45);ctx.lineWidth=lw*.5;ctx.strokeRect(x1,y1,w,h);
    ctx.strokeStyle=c;ctx.lineWidth=lw*1.4;ctx.beginPath();
    [[x1,y1,1,1],[x1+w,y1,-1,1],[x1,y1+h,1,-1],[x1+w,y1+h,-1,-1]].forEach(([x,y,sx,sy])=>{ctx.moveTo(x,y+sy*L);ctx.lineTo(x,y);ctx.lineTo(x+sx*L,y)});
    ctx.stroke();ctx.shadowBlur=0;
    const t=`${pretty(d.label)} ${pct(d.confidence)}`,tw=ctx.measureText(t).width+fs*1.1,th=fs*1.7,ty2=y1-th-6>=0?y1-th-6:y1+6;
    ctx.fillStyle='rgba(5,7,13,.78)';ctx.beginPath();ctx.roundRect(x1,ty2,tw,th,th/2);ctx.fill();
    ctx.strokeStyle=c;ctx.lineWidth=lw*.5;ctx.stroke();
    ctx.fillStyle=c;ctx.fillText(t,x1+fs*.55,ty2+th/2+1);
  }
}

/* ---------- scanner status ---------- */
fetch('/api/health').then((r)=>r.json()).then((h)=>{$('#status').classList.add('on');$('#statusTxt').textContent=`Scanner online${h.classifier?' with species classifier':''}`})
  .catch(()=>{$('#statusTxt').textContent='Scanner offline. Start it with python run.py'});
</script>
</body>
</html>
